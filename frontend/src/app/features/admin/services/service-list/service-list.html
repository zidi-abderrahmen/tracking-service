<div class="user-list-container">

    <h1>SERVICE LIST</h1>

    <div class="main-content">

        <div class="search-container">

            <div class="input-container">

                <label for="search">Search</label>
                <input type="text" name="search" (input)="checkEmptySearchField(searchTerm.trim())" [(ngModel)]="searchTerm" (keyup.enter)="onSearch()" placeholder="Search bar...">

            </div>

            <button type="submit" class="search-button" (click)="onSearch()">
                Search
            </button>

            <button routerLink="/admin/services/add" type="submit" class="add-button">
                Add Service
            </button>

        </div>

        <table>

            <thead>
                <tr> 
                    <th>TITLE</th> 
                    <th>CLIENT NAME</th>
                    <th>ACTIONS</th>
                </tr>
            </thead>

            <tbody>
                @for (s of services; track s.idService) {
                    <tr>
                        <td>{{ s.title }}</td>
                        <td>{{ s.client.firstName }} {{ s.client.lastName }}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="action-btn view" title="View" [routerLink]="['/admin/services/details', s.idService]">
                                    <span class="material-icons">visibility</span>
                                </button>
                                
                                <button class="action-btn edit" title="Edit" [routerLink]="['/admin/services/edit', s.idService]">
                                    <span class="material-icons">edit</span>
                                </button>
                                
                                <button class="action-btn delete" title="Delete" (click)="onDelete(s.idService, s.title)">
                                    <span class="material-icons">delete</span>
                                </button>
                            </div>
                        </td>
                    </tr>
                } @empty {
                    <tr>
                        <td colspan="3" style="text-align: center;" class="empty-message">No services found.</td>
                    </tr>
                }
            </tbody>

        </table>

    </div>

</div>
