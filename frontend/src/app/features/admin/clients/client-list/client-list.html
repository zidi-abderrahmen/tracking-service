<div class="user-list-container">

    <h1>CLIENT LIST</h1>

    <div class="main-content">

        <div class="search-container">

            <div class="input-container">

                <label for="search">Search</label>
                <input type="text" name="search" (input)="checkEmptySearchField(searchTerm.trim())" [(ngModel)]="searchTerm" (keyup.enter)="onSearch()" placeholder="Search bar...">

            </div>

            <button type="submit" class="search-button" (click)="onSearch()">
                Search
            </button>

            <button routerLink="/admin/clients/add" type="submit" class="add-button">
                Add Client
            </button>

        </div>

        <table>

            <thead>
                <tr> 
                    <th>COMPANY NAME</th> 
                    <th>EMAIL</th>
                    <th>ACTIONS</th>
                </tr>
            </thead>

            <tbody>
                @for (u of clients; track u.idClient) {
                    <tr>
                        <td>{{ u.companyName }}</td>
                        <td>{{ u.email }}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="action-btn view" title="View" [routerLink]="['/admin/clients/details', u.idClient]">
                                    <span class="material-icons">visibility</span>
                                </button>
                                
                                <button class="action-btn edit" title="Edit" [routerLink]="['/admin/clients/edit', u.idClient]">
                                    <span class="material-icons">edit</span>
                                </button>
                                
                                <button class="action-btn delete" title="Delete" (click)="onDelete(u.idClient, u.firstName, u.lastName)">
                                    <span class="material-icons">delete</span>
                                </button>
                            </div>
                        </td>
                    </tr>
                } @empty {
                    <tr>
                        <td colspan="3" style="text-align: center;" class="empty-message">No clients found.</td>
                    </tr>
                }
            </tbody>

        </table>

    </div>

</div>
