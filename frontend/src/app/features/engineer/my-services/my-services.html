<div class="user-list-container">

    <h1>MY SERVICES</h1>

    <div class="main-content">

        <div class="search-container">

            <div class="input-container">

                <label for="search">Search</label>
                <input type="text" name="search" (input)="checkEmptySearchField(searchTerm.trim())" [(ngModel)]="searchTerm" (keyup.enter)="onSearch()" placeholder="Search bar...">

            </div>

            <button type="submit" class="search-button" (click)="onSearch()">
                Search
            </button>

        </div>

        <table>

            <thead>
                <tr> 
                    <th>CLIENT</th>
                    <th>SERVICE</th> 
                    <th>START DATE</th>
                    <th>END DATE</th>
                    <th>DETAILS</th>
                </tr>
            </thead>

            <tbody>
                @for (a of assignments; track a.idServicesEngineer) {
                    <tr>
                        <td>{{ a.service.client.companyName }}</td>
                        <td>{{ a.service.title }}</td>
                        <td>{{ a.service.startDate }}</td>
                        <td>{{ a.service.endDate }}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="action-btn view" title="View" [routerLink]="['/engineer/my-services/details', a.service.idService]">
                                    <span class="material-icons">visibility</span>
                                </button>
                            </div>
                        </td>
                    </tr>
                } @empty {
                    <tr>
                        <td colspan="5" style="text-align: center;" class="empty-message">No data found.</td>
                    </tr>
                }
            </tbody>

        </table>

    </div>

</div>
